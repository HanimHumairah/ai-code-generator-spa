<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Code Generator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<main class="card">
  <div class="badge">⚡ Prompt → Live Website</div>
  <h1>AI Code <span class="grad">Generator</span></h1>
  <p class="sub">Describe any webpage. AI writes it, deploys it, and emails you the live link.</p>
  <div class="chips">
    <button class="chip" data-prompt="A memory card matching game with fruit emojis, flip animations and a win message">🃏 Memory game</button>
    <button class="chip" data-prompt="A BMI calculator with color-coded results and smooth animations">💪 BMI calculator</button>
    <button class="chip" data-prompt="A pomodoro timer with start, pause and reset, dark theme with neon accents">⏱ Pomodoro timer</button>
    <button class="chip" data-prompt="A landing page for a coffee shop with menu section and contact form">☕ Coffee shop</button>
  </div>
  <textarea id="prompt" rows="3" placeholder="e.g. A weather dashboard with animated icons and a 5-day forecast..."></textarea>
  <button id="go" class="btn"><span id="btn-label">Generate &amp; Deploy</span></button>
  <p id="status"></p>
</main>
<script src="app.js"></script>
</body>
</html>
