<!DOCTYPE html>
<html>
<head>
<title>AI Code Generator</title>
<style>
  body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f4f4f9; }
  .box { text-align: center; max-width: 500px; padding: 20px; }
  textarea { width: 100%; height: 80px; padding: 10px; font-size: 1rem; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
  button { margin-top: 10px; padding: 10px 24px; font-size: 1rem; background: #0066cc; color: #fff; border: none; border-radius: 20px; cursor: pointer; }
  #status { margin-top: 15px; color: #333; }
</style>
</head>
<body>
<div class="box">
  <h2>AI Code Generator</h2>
  <textarea id="prompt" placeholder="Describe the webpage you want..."></textarea><br>
  <button onclick="submitPrompt()">Generate &amp; Deploy</button>
  <p id="status"></p>
</div>
<script>
  const WEBHOOK_URL = 'https://tops-moderate-innovation-england.trycloudflare.com/webhook/generate-code';

  async function submitPrompt() {
    const prompt = document.getElementById('prompt').value;
    const status = document.getElementById('status');
    if (!prompt) { status.textContent = 'Please type a prompt first.'; return; }
    status.textContent = 'Sending... this may take a moment.';
    try {
      await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt })
      });
      status.textContent = 'Request sent! Check your email in a few minutes for the deployed link.';
    } catch (e) {
      status.textContent = 'Error: ' + e.message;
    }
  }
</script>
</body>
</html>
